[package]
name = "fd-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Fusion-Design CLI — command-line batch generation/export"

[lib]
name = "fd_cli"
path = "src/lib.rs"

[[bin]]
name = "fusion-design"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# OPS-13: daily-rotating file log NonBlocking writer + WorkerGuard keepalive.
tracing-appender = { workspace = true }
# OPS-13: resolve platform log directory (macOS ~/Library/Logs/fusion-design).
dirs = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
# Callers: CLI main.rs (bin), fd_cli::lib (lib)
# Affected API: Codegen subcommand, fd-codegen/fd-canvas-core crate deps
# Data schemas: PenDocument JSON→HTML/React/Tailwind code output
# User instruction: "start implementation now" — Task #14 P3-3 fd-codegen
fd-ai-adapter = { path = "../fd-ai-adapter" }
fd-canvas-core = { path = "../fd-canvas-core" }
fd-codegen = { path = "../fd-codegen" }
fd-design-system = { path = "../fd-design-system" }
fd-export = { path = "../fd-export" }
fd-design-lint = { path = "../fd-design-lint" }
fd-search = { path = "../fd-search" }
fd-ecosystem = { path = "../fd-ecosystem" }
fd-host-desk = { path = "../fd-host-desk" }

[dev-dependencies]
tempfile = "3"
# OPS-10: integration tests need a TcpListener mock 127.0.0.1 health endpoint (no mock server crate).
# multi_thread runtime: output() blocks the current worker; a single-thread runtime would starve the mock accept task.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
