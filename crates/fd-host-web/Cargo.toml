[package]
name = "fd-host-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Fusion-Design Web 宿主 — wasm32-unknown-unknown 浏览器入口，零 jian 依赖，对接 Fusion-Desk WKWebView"

[lib]
name = "fd_host_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# wasm 绑定
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "console",
  "Document",
  "DocumentFragment",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlElement",
  "MessageEvent",
  "MouseEvent",
  "WheelEvent",
  "Window",
  "CanvasRenderingContext2d",
  "ImageData",
  "Blob",
  "Url",
  "FileReader",
  "Navigator",
  "Location",
  "Performance",
  "CssStyleDeclaration",
  "HtmlHeadElement",
  "NodeList",
  "Node",
  "HtmlCollection",
  "DomRect",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
base64 = "0.22"
# 自研画布模型
fd-canvas-core = { path = "../fd-canvas-core" }
fd-design-system = { path = "../fd-design-system" }