[package]
name = "fd-ecosystem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Fusion-Design ecosystem link — integrates Fusion Code/Simulation/KB/CLI"

[lib]
name = "fd_ecosystem"
path = "src/lib.rs"

# Callers: fd-cli (export/generate IPC send, train), DesignBridge.swift
# Affected API: EcosystemLink::send/list/consume/sync_to_code/search_templates/templates,
#   TrainerClient::run_sft/run_rlsl
# H-A3/P2-2: watch_async + self-built MCP layer removed (zero external calls, dead code).
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
# H-A3/P2-2: notify removed (only used by watch_async, which is gone).
fd-canvas-core = { path = "../fd-canvas-core" }
fd-codegen = { path = "../fd-codegen" }
# op-mcp not pulled in (private deps); the self-built MCP layer was removed (non-compliant, see audit H-A4).

[dev-dependencies]
tempfile = "3"
