[package]
name = "fd-skills"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Fusion-Design AI design skills — trait-based capabilities + registry, decoupled from the inference client"

[lib]
name = "fd_skills"
path = "src/lib.rs"

# ARCH-11: fd-skills is a pure trait + helper + parsing layer, zero HTTP (inference is done by the
# adapter's FusionMlxClient impl of the SkillContext trait). Deps are only serde_json/tracing/base64/
# tokio (encode_image_base64_async uses tokio::fs) + fd-canvas-core (PenDocument) +
# fd-design-system (DesignSystem token_prompt_fragment).
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true }
fd-canvas-core = { path = "../fd-canvas-core" }
fd-design-system = { path = "../fd-design-system" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt", "macros"] }
