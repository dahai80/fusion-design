<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artifacts · Fusion Design</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="landing" id="landing">
  <header class="landing-head">
    <div class="tabs" role="tablist" id="tab-row">
      <button class="tab active" role="tab" data-tab="all" aria-selected="true" data-i18n="tabAll">全部</button>
      <button class="tab" role="tab" data-tab="mine" aria-selected="false" data-i18n="tabMine">我的</button>
      <button class="tab" role="tab" data-tab="shared" aria-selected="false" data-i18n="tabShared">与您共享</button>
    </div>
    <div class="landing-tools">
      <button id="search-toggle" class="btn ghost icon" aria-label="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <input id="search-input" class="sel search hidden" type="search" placeholder="搜索" data-i18n-ph="searchPh" />
      <select id="sort-select" class="sel" aria-label="sort">
        <option value="updated_at" data-i18n="sortOpened">最近打开</option>
        <option value="created_at" data-i18n="sortCreated">创建日期</option>
        <option value="name" data-i18n="sortName">名称</option>
        <option value="starred" data-i18n="sortPinned">置顶优先</option>
      </select>
    </div>
  </header>

  <section class="create-block">
    <h2 class="block-title" data-i18n="createNew">创建新内容</h2>
    <div class="create-row">
      <a class="create-card" id="create-doc" href="workbench.html?kind=document" data-kind="document">
        <span class="create-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
        </span>
        <span class="create-title" data-i18n="docTitle">文档</span>
        <span class="create-sub" data-i18n="docSub">写作、总结与说明</span>
      </a>
      <a class="create-card" id="create-slides" href="workbench.html?kind=slides" data-kind="slides">
        <span class="create-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></svg>
        </span>
        <span class="create-title" data-i18n="slidesTitle">幻灯片</span>
        <span class="create-sub" data-i18n="slidesSub">演示与汇报</span>
      </a>
      <a class="create-card" id="create-design" href="workbench.html?kind=design" data-kind="design">
        <span class="create-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19l1-5.8L3.5 9.2l5.9-.9z"/></svg>
        </span>
        <span class="create-title" data-i18n="designTitle">设计</span>
        <span class="create-sub" data-i18n="designSub">界面与原型</span>
      </a>
    </div>
  </section>

  <section class="list-block">
    <div class="list-head">
      <h2 class="block-title" data-i18n="allArtifacts">所有 Artifacts</h2>
      <span id="list-count" class="list-count"></span>
    </div>
    <div id="artifact-grid" class="artifact-grid" aria-live="polite"></div>
    <p id="list-empty" class="side-note hidden" data-i18n="emptyList">还没有内容。从上面的「创建新内容」开始。</p>
    <div class="pager" id="pager">
      <button id="prev-page" class="btn" data-i18n="prev">上一页</button>
      <span id="page-label" class="page-label"></span>
      <button id="next-page" class="btn" data-i18n="next">下一页</button>
    </div>
  </section>
</div>
<script src="landing.js" type="module"></script>
</body>
</html>
