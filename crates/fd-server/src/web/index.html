<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fusion Design</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="workbench" id="workbench">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">✳</span>
      <span class="brand-name">Fusion Design</span>
    </div>
    <div class="topbar-actions">
      <select id="lang-select" class="sel" aria-label="language">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
      <button id="theme-toggle" class="btn ghost" title="theme">🌙</button>
      <span id="svc-status" class="status-chip" data-state="unknown">…</span>
    </div>
  </header>

  <main class="columns">
    <!-- 左：对话 -->
    <section class="col col-chat">
      <div class="col-head">
        <h2 data-i18n="chat">对话</h2>
      </div>
      <div id="fd-chat" class="chat-log" aria-live="polite"></div>
      <div class="presets" id="preset-row">
        <button class="chip" data-ds="apple-hig">Apple HIG</button>
        <button class="chip" data-ds="minimal-dashboard">极简后台</button>
        <button class="chip" data-ds="robot-sim">robot-sim</button>
      </div>
      <form id="composer" class="composer">
        <div id="paste-hint" class="paste-hint hidden" data-i18n="pasteHint">已贴入截图，发送即还原</div>
        <textarea id="prompt-input" rows="3"
          data-i18n-ph="composerPh"
          placeholder="描述界面，或直接粘贴截图/草图还原…（Enter 发送，Shift+Enter 换行）"></textarea>
        <div class="composer-row">
          <span id="pending-image" class="pending-image hidden"></span>
          <button type="submit" id="send-btn" class="btn primary" data-i18n="send">生成</button>
        </div>
      </form>
    </section>

    <!-- 中：画布 -->
    <section class="col col-canvas">
      <div class="col-head">
        <h2 data-i18n="canvas">画布</h2>
        <div class="viewport-switch" role="tablist">
          <button class="chip vp" data-vp="iphone" role="tab">iPhone</button>
          <button class="chip vp" data-vp="ipad" role="tab">iPad</button>
          <button class="chip vp active" data-vp="desktop" role="tab" aria-selected="true">🖥</button>
        </div>
      </div>
      <div class="canvas-frame" id="canvas-frame">
        <div class="canvas-stage" id="fd-canvas-stage">
          <canvas id="fd-canvas-mount" class="canvas-mount"></canvas>
          <div id="fusion-dom-root" class="dom-root"></div>
        </div>
        <div class="canvas-empty" id="canvas-empty" data-i18n="canvasEmpty">
          尚无设计。在左侧描述界面，生成后在此预览。
        </div>
      </div>
    </section>

    <!-- 右：版本 + 导出 -->
    <section class="col col-side">
      <div class="col-head">
        <h2 data-i18n="versions">版本</h2>
      </div>
      <div id="fd-versions" class="version-list"></div>
      <div class="side-block">
        <h3 data-i18n="export">导出</h3>
        <div class="export-row">
          <button id="export-html" class="btn" data-i18n="expHtml">HTML</button>
          <button id="export-react" class="btn" data-i18n="expReact">React</button>
        </div>
        <p class="side-note" data-i18n="exportNote">HTML 直接可开；React 为 TSX 组件（Tailwind）。</p>
      </div>
    </section>
  </main>
</div>
<script src="/app.js" type="module"></script>
</body>
</html>
