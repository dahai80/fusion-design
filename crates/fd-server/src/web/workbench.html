<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fusion Design</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="workbench" id="workbench">
  <header class="toolbar">
    <div class="toolbar-group">
      <a href="index.html" class="btn ghost icon" id="back-to-artifacts" title="Artifacts" aria-label="Artifacts">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <div class="viewport-switch" role="tablist">
        <button class="seg vp" data-vp="iphone" role="tab" title="iPhone" aria-label="iPhone">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
        </button>
        <button class="seg vp" data-vp="ipad" role="tab" title="iPad" aria-label="iPad">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M11 18h2"/></svg>
        </button>
        <button class="seg vp active" data-vp="desktop" role="tab" aria-selected="true" title="Desktop" aria-label="Desktop">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        </button>
      </div>
    </div>
    <div class="toolbar-group">
      <span id="svc-status" class="status-chip" data-state="unknown">…</span>
      <select id="lang-select" class="sel" aria-label="language">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
      <button id="theme-toggle" class="btn ghost icon" aria-label="theme">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main class="columns">
    <!-- 左：对话 -->
    <section class="col col-chat">
      <div class="col-head">
        <h2 data-i18n="chat">对话</h2>
      </div>
      <div id="fd-chat" class="chat-log" aria-live="polite"></div>
      <div class="presets" id="preset-row">
        <button class="chip" data-ds="apple-hig">Apple HIG</button>
        <button class="chip" data-ds="minimal-dashboard">极简后台</button>
        <button class="chip" data-ds="robot-sim">robot-sim</button>
      </div>
      <form id="composer" class="composer">
        <div id="paste-hint" class="paste-hint hidden" data-i18n="pasteHint">已贴入截图，发送即还原</div>
        <textarea id="prompt-input" rows="3"
          data-i18n-ph="composerPh"
          placeholder="描述界面，或直接粘贴截图/草图还原…（Enter 发送，Shift+Enter 换行）"></textarea>
        <div class="composer-row">
          <span id="pending-image" class="pending-image hidden"></span>
          <button type="submit" id="send-btn" class="btn primary" data-i18n="send">生成</button>
        </div>
      </form>
    </section>

    <!-- 中：画布 -->
    <section class="col col-canvas">
      <div class="col-head">
        <h2 data-i18n="canvas">画布</h2>
      </div>
      <div class="canvas-frame" id="canvas-frame">
        <div class="canvas-stage" id="fd-canvas-stage">
          <canvas id="fd-canvas-mount" class="canvas-mount"></canvas>
          <div id="fusion-dom-root" class="dom-root"></div>
        </div>
        <div class="canvas-empty" id="canvas-empty">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
          <span data-i18n="canvasEmpty">尚无设计。在左侧描述界面，生成后在此预览。</span>
        </div>
      </div>
    </section>

    <!-- 右：版本 + 导出 -->
    <section class="col col-side">
      <div class="col-head">
        <h2 data-i18n="versions">版本</h2>
      </div>
      <div id="fd-versions" class="version-list"></div>
      <div class="side-block">
        <h3 data-i18n="export">导出</h3>
        <div class="export-row">
          <button id="export-html" class="btn" data-i18n="expHtml">HTML</button>
          <button id="export-react" class="btn" data-i18n="expReact">React</button>
          <button id="send-to-code" class="btn" data-i18n="sendCode">发给 Code</button>
          <button id="save-artifact" class="btn" data-i18n="saveArtifact">存 Artifacts</button>
        </div>
        <p class="side-note" data-i18n="exportNote">HTML 直接可开；React 为 TSX 组件（Tailwind）。</p>
      </div>
    </section>
  </main>
</div>
<script src="app.js" type="module"></script>
</body>
</html>
