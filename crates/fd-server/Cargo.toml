[package]
name = "fd-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Fusion-Design web service surface — generate/iterate/restore/export API + WASM canvas hosting + D1 workbench (issue#31/DS-0)"

[lib]
name = "fd_server"
path = "src/lib.rs"

[[bin]]
name = "fusion-design-server"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }
# Inbound listen stack (127.0.0.1 only). Outbound HTTP forbidden — model calls go exclusively through fd-ai-adapter.
http = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
fd-ai-adapter = { path = "../fd-ai-adapter" }
fd-canvas-core = { path = "../fd-canvas-core" }
fd-codegen = { path = "../fd-codegen" }
fd-design-system = { path = "../fd-design-system" }
fd-search = { path = "../fd-search" }
fd-ecosystem = { path = "../fd-ecosystem" }

[dev-dependencies]
tempfile = "3"
