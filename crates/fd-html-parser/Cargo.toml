[package]
name = "fd-html-parser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Fusion-Design HTML → PenDocument parser (leaf crate, deps: fd-canvas-core + scraper only)"

[lib]
name = "fd_html_parser"
path = "src/lib.rs"

# A-2: split out of the 5040-line fd-ai-adapter monolith. html_to_pen_document and its helpers
# are fully decoupled from adapter internals (FusionMlxClient/SkillRegistry) as a standalone leaf crate.
# fd-ai-adapter re-exports html_to_pen_document so the fd_cli caller stays unchanged.
[dependencies]
fd-canvas-core = { path = "../fd-canvas-core" }
scraper = "0.29"
anyhow = { workspace = true }
tracing = { workspace = true }
