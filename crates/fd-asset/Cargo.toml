[package]
name = "fd-asset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Fusion-Design 素材库管理 — 参考图上传/分类/标注/色彩提取/设计系统绑定"

[lib]
name = "fd_asset"
path = "src/lib.rs"

# Callers: fd-cli (asset subcommands), fd-host-web (asset panel), fd-ai-adapter (ImageToUiSkill reference)
# Affected API: AssetLibrary, AssetItem, AssetCategory, ColorExtraction
# Data schemas: AssetItem (image metadata + annotations + color palette), AssetLibrary (collection + search)
# User instruction: "按照你建议的优先级马上启动落地" — P0 素材库管理模块

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
image = { workspace = true }
fd-canvas-core = { path = "../fd-canvas-core" }
fd-design-system = { path = "../fd-design-system" }

[dev-dependencies]
tempfile = "3"
