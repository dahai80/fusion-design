[package]
name = "fd-canvas-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Fusion-Design canvas core — self-built lightweight vector canvas model (stand-in for OpenPencil jian-ops-schema)"

[lib]
name = "fd_canvas_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# A-5: CSS safety utilities sunk into a standalone leaf crate; this re-export keeps downstream callers unchanged.
fd-css-utils = { path = "../fd-css-utils" }
# H-A10/P1-5: taffy removed (no Rust-side layout computation after the compute_layout dead code deletion).
# The Flex/Grid declarative types LayoutMode/FlexParams/GridParams remain in src/lib.rs,
# consumed by fd-codegen (layout-aware CSS generation) + fd-host-web (DOM rendering).

[dev-dependencies]
tempfile = "3"
