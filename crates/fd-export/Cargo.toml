[package]
name = "fd-export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Fusion-Design export — batch PNG/SVG/PDF/HTML export"

[lib]
name = "fd_export"
path = "src/lib.rs"

# Callers: fd-cli (export/export-batch), DesignBridge (Swift Process)
# Affected API: Exporter (new from_pen_document), CanvasPage conversion
# Data schemas: PenDocument→CanvasPage bridge, enhanced SVG/HTML with NodeStyle
# User instruction: "start implementation now" — Task #16 P3-5 fd-export PNG/SVG/HTML batch export
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
fd-canvas-core = { path = "../fd-canvas-core" }
fd-design-system = { path = "../fd-design-system" }
resvg = { version = "0.50", default-features = false, features = ["text"] }
# printpdf 0.12: lopdf 0.44 fixes RUSTSEC-2026-0187 (deeply nested PDF stack overflow).
# Default html feature disabled (avoids pulling heavy deps like azul-layout/svg2pdf);
# we only use the ops::Op builtin font API, no HTML/CSS layout.
printpdf = { version = "0.12", default-features = false }

[dev-dependencies]
tempfile = "3"
