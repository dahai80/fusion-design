<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>fd-host-web E2E harness</title>
<style>
  body { margin: 0; font: 13px/1.5 -apple-system, system-ui, sans-serif; color: #222; }
  #hud { position: fixed; top: 0; right: 0; width: 360px; max-height: 100vh; overflow: auto;
         background: #fafafa; border-left: 1px solid #ddd; padding: 8px; box-sizing: border-box; }
  #hud h2 { margin: 4px 0 6px; font-size: 13px; }
  #log { white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, monospace; font-size: 11px; }
  .ok { color: #0a7d23; }
  .fail { color: #b00; }
  .info { color: #555; }
  #summary { font-weight: 700; margin: 6px 0; }
  #canvas-host { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="canvas-host">
  <canvas id="fusion-canvas" width="800" height="600"></canvas>
</div>
<div id="hud">
  <h2>fd-host-web E2E harness</h2>
  <div id="summary">初始化中…</div>
  <button id="run-all">运行全部用例</button>
  <button id="clear-log">清空日志</button>
  <pre id="log"></pre>
</div>

<script type="module" src="./harness.js"></script>
</body>
</html>
