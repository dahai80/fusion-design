[workspace]
resolver = "2"
members = [
    # A-5: CSS safety utilities leaf crate (no fd-* deps), re-exported via fd-canvas-core.
    "crates/fd-css-utils",
    "crates/fd-canvas-core",
    "crates/fd-codegen",
    # A-2: html_to_pen_document split into a leaf crate (deps: fd-canvas-core + scraper only).
    "crates/fd-html-parser",
    # ARCH-11: skill system (SkillContext trait + 7 skills + SkillRegistry + pure helpers)
    # migrated out of fd-ai-adapter; the trait decouples it from the inference client. The
    # adapter back-impls SkillContext for FusionMlxClient. fd-skills has zero HTTP: pure trait + helpers + parsing.
    "crates/fd-skills",
    "crates/fd-ai-adapter",
    "crates/fd-design-system",
    "crates/fd-ecosystem",
    "crates/fd-host-web",
    "crates/fd-host-desk",
    # Callers: workspace root, cargo build/test. Affected API: new member fd-design-lint. Data schemas: none. User instruction: "start implementation now" — Task #17
    "crates/fd-export",
    "crates/fd-design-lint",
    # H-A12/P1-6: fd-asset removed (entire crate was dead code, zero production callers, held a "nine endpoints" marketing slot with no function).
    "crates/fd-cli",
    # issue#31/DS-0: Design web service surface (generate/iterate/restore/export API + WASM canvas hosting + D1 workbench).
    # hyper is inbound-listen only (127.0.0.1:11493); all outbound inference goes through fd-ai-adapter, keeping the offline constraint intact.
    "crates/fd-server",
    # issue#44: design-intelligence data layer (builtin CSV dataset + deterministic keyword search),
    # zero HTTP and zero model; consumed by fd-server generation context injection and the fd-cli search subcommand.
    "crates/fd-search",
    # Vendored OpenPencil subsets (standalone manifests, no upstream workspace dep)
    "vendor/openpencil/crates/op-ai",
]
# OpenPencil subset: only crates directly consumed by fusion-design are pulled in,
# avoiding redundant ones such as op-host-desktop (standalone desktop shell) / op-orchestrator (collaboration).
exclude = ["vendor/openpencil"]

[workspace.package]
version = "0.1.30"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
authors = ["Fusion-MLX Team"]
repository = "https://github.com/dahai80/fusion-design"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# OPS-13: fd-cli file logging. appender 0.2 daily rotation, NonBlocking + WorkerGuard;
# dirs 5 resolves the platform log directory (macOS ~/Library/Logs/). Purely local, does not trip deny-external-http.
tracing-appender = "0.2"
dirs = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "io-util"] }
# E-5: default-features=false drops the native-tls/openssl-sys system deps in favor of the pure Rust TLS
# backend rustls-tls. Under the offline constraint, avoid linking system OpenSSL (macOS/Linux divergence + CI images missing libssl).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
url = "2"
futures = "0.3"
base64 = "0.22"
# issue#31/DS-0: fd-server inbound HTTP listen stack. Version matches the existing lock (reqwest transitive deps already
# resolve hyper 1.x); declared as a direct dep without introducing a new version line. server/http1 features only, zero client capability —
# outbound still goes only through fd-ai-adapter (deny-external-http allowlists fd-server's inbound stack and forbids reqwest).
http = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "tokio"] }
http-body-util = "0.1"
# image has been removed from workspace.dependencies (E-35: zero crates reference it with workspace=true, dead declaration;
# and with no references the caret 0.25.x minor-version drift risk cannot materialize).

# OpenPencil crate (path dep, vendored subset)
op-ai = { path = "vendor/openpencil/crates/op-ai" }
# The op-* crates below depend on the private jian-ops-schema and cannot be pulled in; self-built replacements:
#   op-editor-core → fd-canvas-core (PenDocument/PenNode data model)
#   op-codegen     → fd-codegen (HTML/React+Tailwind generation)
#   op-design-lint → fd-design-lint (self-built replacement, 13 detectors)
# op-mcp has no self-built replacement (H-A3/P2-2 removed the non-compliant self-built MCP layer; it cannot be reached by standard MCP clients).

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
