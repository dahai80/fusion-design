[workspace]
resolver = "2"
members = [
    # A-5：CSS 安全工具叶子 crate（无 fd-* 依赖），fd-canvas-core re-export。
    "crates/fd-css-utils",
    "crates/fd-canvas-core",
    "crates/fd-codegen",
    # A-2：html_to_pen_document 拆出叶子 crate（仅 fd-canvas-core + scraper 依赖）。
    "crates/fd-html-parser",
    # ARCH-11：skill 系统（SkillContext trait + 7 skill + SkillRegistry + 纯 helper）
    # 从 fd-ai-adapter 迁出，trait 化解耦 inference client。adapter 反向 impl SkillContext
    # for FusionMlxClient。fd-skills 零 HTTP，纯 trait + helper + 解析逻辑。
    "crates/fd-skills",
    "crates/fd-ai-adapter",
    "crates/fd-design-system",
    "crates/fd-ecosystem",
    "crates/fd-host-web",
    "crates/fd-host-desk",
    # Callers: workspace root, cargo build/test. Affected API: new member fd-design-lint. Data schemas: none. User instruction: "现在开始实施" — Task #17
    "crates/fd-export",
    "crates/fd-design-lint",
    # H-A12/P1-6：fd-asset 已移除（整 crate 死代码，零生产调用，占"九端"宣传位无功能）。
    "crates/fd-cli",
    # Vendored OpenPencil subsets (standalone manifests, no upstream workspace dep)
    "vendor/openpencil/crates/op-ai",
]
# OpenPencil 子集：仅引入与 fusion-design 直接对接的 crate，
# 避免拖入 op-host-desktop（独立桌面壳）/ op-orchestrator（协作）等冗余。
exclude = ["vendor/openpencil"]

[workspace.package]
version = "0.1.14-rc.1"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
authors = ["Fusion-MLX Team"]
repository = "https://github.com/dahai80/fusion-design"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "io-util"] }
# E-5：default-features=false 砍掉 native-tls/openssl-sys 系统依赖，纯 Rust TLS
# 后端 rustls-tls。离线约束下避免链接系统 OpenSSL（macOS/Linux 差异 + CI 镜像缺 libssl）。
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
url = "2"
futures = "0.3"
base64 = "0.22"
# image 已从 workspace.dependencies 移除（E-35：零 crate 引用 workspace=true，死声明；
# 且 caret 0.25.x 子版本行为漂移风险因无引用而不存在）。

# OpenPencil crate（path dep，vendored 子集）
op-ai = { path = "vendor/openpencil/crates/op-ai" }
# 以下 op-* 因依赖私有 jian-ops-schema 无法引入，已自建替身：
#   op-editor-core → fd-canvas-core（PenDocument/PenNode 数据模型）
#   op-codegen     → fd-codegen（HTML/React+Tailwind 生成）
#   op-design-lint → fd-design-lint（自建 13 检测器替身）
# op-mcp 未自建替代（H-A3/P2-2 已移除不合规的自建 MCP 层，无法被标准 MCP client 接入）。

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
