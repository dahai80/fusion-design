name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-test:
    name: fmt + clippy + test + wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (1.94 + wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (all targets)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Workspace compile check
        run: cargo check --workspace --locked

      - name: Tests
        run: cargo test --workspace --locked

      - name: WASM build (fd-host-web)
        run: cargo build -p fd-host-web --target wasm32-unknown-unknown

      # OPS-11：WASM E2E harness 入 CI（headless chromium）。
      # 复用 docs/harness/ 8 用例（harness.js 加载即 runAll 写 #summary）。
      # 产品码 100% 离线约束不受影响——playwright 是 CI 工具链依赖非产品依赖。
      - name: WASM bindgen post-step (harness pkg)
        run: |
          cargo install wasm-bindgen-cli --locked --version 0.2.126
          wasm-bindgen --target web --out-dir docs/harness/pkg \
            target/wasm32-unknown-unknown/debug/fd_host_web.wasm

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright
          npx playwright install --with-deps chromium

      - name: WASM E2E harness (headless)
        run: node Scripts/wasm-harness-check.mjs

  # 修复 E-35：macOS 盲区。main/PR 只跑 ubuntu，macOS 原生工具链
  # （链接器/libsystem/大小写敏感文件系统/临时目录布局）差异到 tag 才暴露。
  # 源码无 macOS 特定 cfg，但 release bin 是 aarch64-apple-darwin，须在
  # 目标平台验证编译+测试，非 tag 才红。轻量 check+test，不打 tarball。
  build-test-macos:
    name: check + test (macos)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (1.94)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - uses: Swatinem/rust-cache@v2

      - name: Workspace compile check
        run: cargo check --workspace --locked

      - name: Tests
        run: cargo test --workspace --locked

  # 依赖漏洞门禁（商用加固项 #1）。
  # 修复 E-34：原 continue-on-error: true 致已知 RUSTSEC 通告随发布上线不阻断。
  # 商用红线：带漏洞发布比延迟发布更糟。改阻断——有 advisory 即 CI 红，强制修。
  audit:
    name: cargo-audit (advisory scan, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (1.94)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies for known advisories
        run: cargo audit

  # 生产代码零 panic 门禁（商用加固项 #3）。
  # 精确排除 #[cfg(test)] mod 块（Python 花括号匹配），扫全部 panic 宏含 match 臂。
  # 修复 E-34：旧 grep `grep -vE "tests|=>"` 双重假阴性——`=>` 排除把
  # match 臂 `=> panic!()` 整行过滤（生产 30+ 处漏网），且 `crates/*/src/*.rs`
  # glob 漏嵌套子目录。
  deny-panic:
    name: deny panic in production code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for panic macros in non-test source
        run: bash Scripts/deny-panic.sh

  # 生产代码 unwrap/expect 硬门禁（商用加固项 #3 扩展）。
  # deny-panic 已封 panic! 宏；本 job 扩展封裸 .unwrap()/.expect()。
  # 现有安全站点录入 Scripts/unwrap-expect-allowlist.txt（编译期常量、WASM window() 惯用法、
  # 启动 fail-fast），新增裸 .unwrap()/.expect() 未在 allowlist → CI 失败。
  # 测试代码（#[cfg(test)] 块）天然排除。已清理站点静默忽略。
  deny-unwrap-expect:
    name: deny unwrap/expect in production code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for new bare .unwrap()/.expect() outside allowlist
        run: bash Scripts/deny-unwrap-expect.sh

  # 离线硬约束全局审计（审计 H-A17）。
  # CLAUDE.md 声明「100% 离线，唯一 HTTP 至 127.0.0.1」，但无全局钩子——新增 crate
  # 引入出站 HTTP 库即静默绕过。本 job 在 CI 层强制出站 HTTP 库（reqwest/ureq/hyper
  # 等）只允许出现在 fd-ai-adapter（唯一发 HTTP 的 crate），其余 crate 依赖声明或
  # src 调用即失败。离线从「建议」升级为「CI 强制」。
  deny-external-http:
    name: deny outbound HTTP outside fd-ai-adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit outbound HTTP libs confined to fd-ai-adapter
        run: bash Scripts/deny-external-http.sh

  # 发布打包：tag 触发，阻断（修复 E-34）。
  # 原 continue-on-error: true 致 tag 推送时 tarball 静默失败，CI 绿但用户无包。
  # release 是 outward-facing 交付物，失败必须红——runner 供给问题用重试/缓存解，
  # 不用吞退出码掩盖。
  release-pack:
    name: release tarball (apple silicon)
    runs-on: macos-14
    if: startsWith(github.ref, 'refs/tags/v')
    # A-1：release-pack 须等全部门禁 job 成功才放行。
    # 原 needs: build-test 致 macOS build / audit / 三道 deny 门禁失败时 tarball 仍发布（解耦漏洞）。
    needs: [build-test, build-test-macos, audit, deny-panic, deny-unwrap-expect, deny-external-http]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (1.94 + wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # OPS-8：release-pack 须装 wasm-bindgen-cli，否则 build.sh 退化为拷贝裸 wasm
      # 改名 _bg.wasm（错误形态，非 --target web 产物），tag 发布包损坏。
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --locked --version 0.2.126

      - name: Build release tarball
        env:
          # OPS-7：可选全签名管线。三个 secret 齐全 → codesign+notarytool+stapler；
          # 缺任一（未配置时 GitHub 注入空串）→ build.sh warn+skip 出未签名件，不阻断。
          APPLE_DEV_ID: ${{ secrets.APPLE_DEV_ID }}
          APP_SPECIFIC_PW: ${{ secrets.APP_SPECIFIC_PW }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: ./Scripts/build.sh

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: fusion-design-release
          path: |
            dist/*.tar.gz
            dist/*.sha256
